<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Cream background circle -->
  <circle cx="100" cy="100" r="100" fill="#F9F5F0"/>
  
  <!-- SPA text with decorative elements -->
  <g>
    <!-- S -->
    <text x="50" y="90" font-size="60" font-family="Georgia, serif" font-weight="bold" fill="#B8860B">S</text>
    
    <!-- P -->
    <text x="80" y="90" font-size="60" font-family="Georgia, serif" font-weight="bold" fill="#B8860B">P</text>
    
    <!-- A with sparkle -->
    <text x="105" y="90" font-size="60" font-family="Georgia, serif" font-weight="bold" fill="#B8860B">A</text>
    
    <!-- Decorative sparkle -->
    <circle cx="125" cy="65" r="3" fill="#B8860B"/>
    <path d="M125 60 L130 70 M120 65 L130 65 M125 70 L125 60" stroke="#B8860B" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Text "SPAJEWELS.co" -->
  <text x="100" y="135" font-size="18" font-family="Georgia, serif" font-weight="normal" fill="#B8860B" text-anchor="middle">SPAJEWELS.CO</text>
  
  <!-- Decorative line -->
  <line x1="50" y1="145" x2="150" y2="145" stroke="#B8860B" stroke-width="1" opacity="0.5"/>
</svg>